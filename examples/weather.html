<!-- Weather: a living sky whose horizon is the next six hours. State: see logic.mjs. -->
<style>
body{margin:0;padding:0 0 max(8px,env(safe-area-inset-bottom));font-family:system-ui,sans-serif}
.s{position:relative;height:272px;overflow:hidden;color:#fff}
.s>*{position:absolute}
.st{width:1px;height:1px}
.o{left:0;top:0;width:44px;height:44px;margin:-22px;border-radius:50%;background:radial-gradient(#fffbe0,#ffd65c 60%,#ffb13d);box-shadow:0 0 50px 18px rgba(255,205,90,.6)}
.o.n{background:radial-gradient(circle at 35% 35%,#fff,#d5ddf0 60%,#aab6d3);box-shadow:0 0 30px 4px rgba(200,215,255,.4)}
.c{width:44vw;height:44vw;fill:var(--c);scale:0;transform-origin:100% 30%;transition:scale 1s;animation:d 40s ease-in-out infinite alternate}
.c1{right:4vw;top:-34px}.c2{right:-17vw;top:-8px;animation-duration:55s}.c3{right:-9vw;top:52px;animation-duration:33s}
.k1 .c3,.k6 .c1{scale:.8}.k2 .c,.k3 .c,.k4 .c,.k5 .c,.k6 .c2{scale:1}
@keyframes d{to{translate:36px}}
.p{top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 62%)}
.p i{position:absolute;top:-20px;width:1.5px;height:11px;background:rgba(255,255,255,.55);display:none;animation:r .7s linear infinite}
.k3 .p i,.k4 .p i,.k5 .p i{display:block}
.k5 .p i{width:4px;height:4px;border-radius:50%;background:#fff;animation-duration:5s}
@keyframes r{to{transform:translate(-36px,250px)}}
.k4 .p{animation:z 6s infinite}
@keyframes z{92%,96%{background:rgba(255,255,255,.55)}}
.g{left:0;bottom:0;width:100%;height:100px}
.g path{fill:var(--tg-theme-bg-color)}
.g use{fill:rgba(255,255,255,.16)}
.n{left:14px;top:12px;font-weight:600}
.n b{display:inline-block;width:5px;height:5px;margin:0 0 2px 5px;border-radius:50%;background:rgba(255,255,255,.4)}
.n b.on{background:#fff}
.t{left:12px;top:32px;font:200 58px/1 ui-rounded,system-ui}
.k{left:14px;top:94px;font-size:13px;font-weight:600;line-height:1.3}
.k small{display:block;font-weight:400;color:rgba(255,255,255,.8)}
.q{width:40px;margin:-5px -20px;text-align:center;font-size:12px;font-weight:700;color:var(--tg-theme-text-color)}
.e .q{display:none}
.q:before{content:"";display:block;width:6px;height:6px;margin:0 auto 3px;border-radius:50%;background:var(--d);border:2px solid var(--tg-theme-bg-color)}
.hr{left:0;right:0;bottom:4px;display:flex;color:var(--tg-theme-hint-color);font-size:11px;text-align:center}
.hr div{flex:1}
svg{display:block;margin:auto}
.i{width:20px;height:20px}
.a{stroke:#3b9be8;stroke-width:2;stroke-linecap:round;fill:none}
.x{display:flex;margin:8px 12px 0;padding-top:9px;border-top:1px solid var(--tg-theme-section-separator-color);text-align:center;font-weight:600}
.x div{flex:1}
.x small,.u{display:block;color:var(--tg-theme-hint-color);font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.u{margin:8px 14px 0;text-transform:none;letter-spacing:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<svg width="0" height="0" style="position:absolute"><symbol id="c" viewBox="0 0 24 24"><path d="M7 19a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.5 1.3A3.9 3.9 0 0 1 17.5 19z"/></symbol>
<symbol id="y" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="#f5a623"/><circle cx="12" cy="12" r="8.6" fill="none" stroke="#f5a623" stroke-width="2.4" stroke-dasharray="1.6 5.15"/></symbol>
<symbol id="m" viewBox="0 0 24 24"><path d="M14 3a9 9 0 1 0 7 13A8 8 0 0 1 14 3z" fill="#9aa8c7"/></symbol></svg>
<div class="s" id="s"><i class="st" id="st"></i><i class="o" id="o"></i>
<svg class="c c1"><use href="#c"/></svg><svg class="c c2"><use href="#c"/></svg><svg class="c c3"><use href="#c"/></svg>
<div class="p" id="p"></div>
<svg class="g" viewBox="0 0 600 100" preserveAspectRatio="none"><use href="#g" transform="translate(-90 -14) scale(1.3 1)"/><path id="g"/></svg>
<div class="n" id="n"></div><div class="t" id="t"></div><div class="k" id="k"></div>
<div class="hr" id="hr"></div></div>
<div class="x" id="x"></div><div class="u" id="u"></div>
<script>
const W=window.TelegramWidget||{},$=i=>document.getElementById(i),S=$('s'),Q=[],
K=['Clear','Partly cloudy','Cloudy','Rain','Thunderstorm','Snow','Fog'],
N=[0x0a0f2c,0x1c2452,0x3b3f78],T=[0x2a3a7c,0xd96f8e,0xffb56b],Y=[0x2478e6,0x52adf5,0xa8dcff],G=[0x4d5a6c,0x7f8d9e,0xb5bfc9],
A='<path class="a" d="M8 19l-1 3m5-3l-1 3m5-3l-1 3"',U='<use href="#',H=U+'c"/>',L=U+'c" y="-3"/>',B='" transform="translate(7 -1) scale(.62)"/>',
I=[U+'y"/>',U+'y'+B+H,H,L+A+'/>',L+'<path d="M13 14l-4 5h3l-1 4 5-6h-3l2-3z" fill="#f5a623"/>',L+A+' stroke-dasharray=".1 3" stroke="#7fbfe9" stroke-width="2.6"/>',
'<path class="a" stroke="currentColor" d="M5 9h14M3 14h18M6 19h12"/>'],
P=s=>{try{return JSON.parse(s)}catch(e){}},
mx=(a,b,t)=>[16,8,0].reduce((r,s)=>r|Math.round((a>>s&255)*(1-t)+(b>>s&255)*t)<<s,0),
hx=c=>'#'+(c+16777216).toString(16).slice(1),cl=x=>x<0?0:x>1?1:x;
let D,ci,V,raf;
// One city as numbers, so one scene can turn into another: 3 sky colors, cloud tint, then sun x %, sun y, stars, 6 heights.
function scene(c){
 let x=Math.min(c.m-c.a,c.z-c.m)/90,d=x>0,g=[0,.15,.6,.75,.9,.6,.7][c.k],
 fr=d?(c.m-c.a)/(c.z-c.a):((c.m-c.z+1440)%1440)/(1440-c.z+c.a),
 lo=Math.min(...c.f),hi=Math.max(...c.f,lo+6);
 x=cl(Math.abs(x));
 const s=T.map((t,i)=>mx(0,mx(mx(t,(d?Y:N)[i],x),mx(G[i],N[i],d?0:.7),g),W.colorScheme=='dark'?.82:1));
 return{c:[...s,c.k>1?mx(s[0],s[2],.45):mx(s[1],d?0xffffff:0x5a6488,.8)],
  n:[50+42*fr,214-Math.sin(Math.PI*fr)*160,d?0:x*(1-g),...c.f.map(t=>36-(t-lo)/(hi-lo)*28)]}
}
function paint(v){
 let n=v.n,d='M0 '+n[3]+'H50',i=0;
 S.style.background='linear-gradient('+hx(v.c[0])+','+hx(v.c[1])+' 50%,'+hx(v.c[2])+' 82%)';
 S.style.setProperty('--c',hx(v.c[3]));S.style.setProperty('--d',hx(v.c[1]));
 $('o').style.transform='translate('+n[0]+'vw,'+n[1]+'px)';
 $('st').style.color='rgba(255,255,255,'+n[2]+')';
 for(;i<6;i++){if(i<5)d+='C'+(100+i*100)+' '+n[3+i]+' '+(100+i*100)+' '+n[4+i]+' '+(150+i*100)+' '+n[4+i];Q[i].style.top=172+n[3+i]+'px'}
 $('g').setAttribute('d',d+'H600V100H0z')
}
function go(to){
 let from=V,t0=0;V=to;cancelAnimationFrame(raf);
 if(!from||matchMedia('(prefers-reduced-motion:reduce)').matches)return paint(to);
 raf=requestAnimationFrame(function f(now){
  let t=cl((now-(t0=t0||now))/700),e=t*t*(3-2*t);
  paint({c:to.c.map((c,i)=>mx(from.c[i],c,e)),n:to.n.map((x,i)=>from.n[i]+(x-from.n[i])*e)});
  if(t<1)raf=requestAnimationFrame(f)})
}
function draw(){
 let c=D&&D.c[ci%=D.c.length],h;
 if(!c){S.className='s e';go({c:[...T,0],n:[50,300,0,36,36,36,36,36,36]});$('t').textContent='–°';$('u').textContent='The forecast is on its way.';return}
 S.className='s k'+c.k;$('o').className='o'+(c.m>=c.a&&c.m<c.z?'':' n');
 $('n').innerHTML=c.n+' '+(D.c.length>1?D.c.map((_,i)=>'<b'+(i==ci?' class="on"':'')+'></b>').join(''):'');
 $('t').textContent=c.t+'°';$('k').innerHTML=K[c.k]+'<small>H '+c.h+'° · L '+c.l+'°</small>';
 $('hr').innerHTML=c.f.map((t,i)=>{h=((c.m/60|0)+i)%24;Q[i].textContent=t+'°';return'<div><svg class="i" viewBox="0 0 24 24" fill="currentColor">'+I[c.w[i]].replace(h*60<c.a||h*60>=c.z?/#y/:0,'#m')+'</svg>'+(i?h+':00':'Now')+'</div>'}).join('');
 $('x').innerHTML=['Wind','Humidity','UV'].map((l,i)=>'<div><small>'+l+'</small>'+c.x[i]+[' km/h','%',''][i]+'</div>').join('');
 $('u').textContent=(W.isForward||Date.now()/6e4-D.u/60>90?'As of ':'Live · updated ')+new Date(D.u*1e3).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 go(scene(c));W.ready&&W.ready()
}
// Shared state first; the same JSON in chat_data works for a static send.
const read=()=>{let d=P(W.publicData)||P(W.chatData);if(d&&d.c&&!(D&&d.r<D.r))D=d;draw()};
{let i=0,s='';
 for(;i<26;i++)s+=(i*37%100)+'vw '+(i*53%150)+'px 0 '+(i%3?0:.6)+'px,';
 $('st').style.boxShadow=s.slice(0,-1);
 for(s='',i=0;i<16;i++)s+='<i style="left:'+(i*6.6+4)+'%;animation-delay:-'+(i*.37%1*5).toFixed(2)+'s"></i>';
 $('p').innerHTML=s;
 for(i=0;i<6;i++){Q[i]=document.createElement('div');Q[i].className='q';Q[i].style.left=(i*2+1)/12*100+'%';S.insertBefore(Q[i],$('hr'))}
 try{ci=localStorage.getItem('c')}catch(e){}
 ci=+(ci??(P(W.chatData)||{}).i??0);
 read();
 S.onclick=()=>{if(!D||D.c.length<2)return;ci++;try{localStorage.setItem('c',ci)}catch(e){}try{W.HapticFeedback.selectionChanged()}catch(e){}draw()};
 if(W.onEvent){['publicDataChanged','chatDataChanged','themeChanged'].map(n=>W.onEvent(n,read));W.watchPublicData&&W.watchPublicData()}
}
</script>
